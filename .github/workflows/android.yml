
name: Build Tunes APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q Tunes-Cloud-Build.zip -d source
          ls source/Tunes

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p source/Tunes assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tunes-debug-apk
          path: source/Tunes/app/build/outputs/apk/debug/app-debug.apk
